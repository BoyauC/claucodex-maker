<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>街機格鬥王</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <p class="tag">Original Arcade Fighting Game</p>
      <h1>街機格鬥王</h1>
      <p>原創雙人格鬥小遊戲：移動、跳躍、攻擊、防禦，把對手血量歸零即可獲勝。</p>
    </header>

    <section class="hud">
      <div><strong>玩家 1</strong><div class="bar"><span id="p1hp"></span></div><small>A/D 移動、W 跳、F 拳、G 防禦</small></div>
      <div class="timer" id="timer">60</div>
      <div><strong>玩家 2</strong><div class="bar"><span id="p2hp"></span></div><small>←/→ 移動、↑ 跳、K 拳、L 防禦</small></div>
    </section>

    <canvas id="game" width="960" height="520"></canvas>

    <section class="controls">
      <button id="restart">重新開始</button>
      <p id="message">按鍵開始對戰！</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
